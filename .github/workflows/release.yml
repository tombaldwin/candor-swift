name: release
# Tag-driven release with the engineVersion guard: pushing vX.Y.Z asserts main.swift's engineVersion
# constant is "candor-swift-X.Y.Z" BEFORE anything ships — the recurring footgun was a tag cut against
# a binary still stamping the previous version (the report's build id would then lie about the release).
# Gates (swift test + smoke) rerun here even though CI ran them on the commit: the tag may be cut later,
# against a spec floor that has moved.

on:
  push:
    tags: ['v*']
  # A stalled Actions queue orphans the tag-triggered run: GitHub creates it, never expands it
  # into jobs, and it can be neither cancelled (409 "has not been queued yet") nor rerun. The
  # only recovery was then deleting and re-pushing a tag a live Release points at. Measured
  # 2026-08-26 on the 0.33.0 cut — candor-ts recovered in seconds because it already had this
  # trigger; this repo needed tag surgery. Re-running is safe: every step is idempotent and the
  # engineVersion guard still asserts the tag matches the binary before anything ships.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # Same budget as CI: a healthy run is ~3 min; past 20 is a hung runner (observed live, twice).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Tag must equal the engineVersion constant
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if ! grep -q "^let engineVersion = \"candor-swift-${VER}\"$" Sources/candor-swift/main.swift; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match main.swift's engineVersion:"
            grep -n 'let engineVersion' Sources/candor-swift/main.swift
            exit 1
          fi
      - name: Build
        run: swift build
      - name: Unit tests
        # `script` gives swift test a TTY → line-buffered output, so a hang names the last test started.
        run: script -q /dev/null swift test
      - name: Smoke (oracle needs the spec as a sibling — same pin as ci.yml)
        # LITERAL, and it must be moved BY HAND alongside ci.yml's `CANDOR_SPEC_PIN`. A workflow-level
        # `env:` does not reach here from the other file, so the two drift silently and the release lane
        # can certify against an older contract than the PR lane that approved the change. Kept as
        # `3c643e5` (the ⟨0.32⟩ carve-out commit) to match ci.yml.
        run: |
          git clone https://github.com/tombaldwin/candor-spec ../candor-spec
          git -C ../candor-spec checkout --quiet 3c643e54c22b5f4352ea944800b55fba72dc211b
          bash smoke.sh
      - name: Create the GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        # Create-or-keep: a release may ALREADY exist for this tag — cut by hand with curated notes (the
        # richer ⚠/soundness write-ups this project uses), or by a re-run of this job. A bare
        # `gh release create` then fails 422 "tag_name already exists" and reds the run for nothing (the
        # gates above are what matter and already passed). Only auto-create when none exists.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — keeping it (gates passed; nothing to do)."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # THE BINARY. Until 2026-08-05 this workflow built, tested, smoked and cut a release — and attached
      # NOTHING, so every candor-swift release had zero assets and `candor update` could only say "build
      # from the candor-swift repo (macOS): swift build -c release". Every other engine installs itself;
      # swift asked for a Swift toolchain and a source build. That is the entire install story for the
      # PRIVACY MANIFEST, a swift-only capability — so the one feature with a case study written about it
      # was the one nobody could install to try.
      #
      # macos-15 is arm64 and Package.swift targets macOS 13+, where the Swift runtime ships with the OS,
      # so a release build here runs on a supported Mac with no toolchain. Named to candor-java's
      # convention (`candor-macos-arm64`).
      - name: Build the release binary and attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          swift build -c release
          BIN=.build/release/candor-swift
          test -x "$BIN" || { echo "::error::no release binary at $BIN"; exit 1; }
          # The gate above checks the SOURCE version; this checks the ARTIFACT a user actually runs.
          got="$("$BIN" --version | head -1)"
          case "$got" in
            *"${GITHUB_REF_NAME#v}"*) ;;
            *) echo "::error::binary reports '$got', which does not name ${GITHUB_REF_NAME#v}"; exit 1;;
          esac
          cp "$BIN" candor-swift-macos-arm64
          gh release upload "$GITHUB_REF_NAME" candor-swift-macos-arm64 --clobber
