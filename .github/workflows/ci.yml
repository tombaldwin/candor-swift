name: ci
# Superseded runs are cancelled — a swift CI run is ~20-40 min (SwiftSyntax compile), and without
# this a push-per-hour day left runs stacked in_progress for hours (observed live).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly spec-HEAD tracking (the spec-head job below): floor rises in candor-spec surface here,
    # not as a red X on unrelated PRs (the push/PR jobs pin the spec).
    - cron: '17 6 * * 1'
  # Recovery: a stalled Actions queue can orphan a push-triggered run — created, never expanded into
  # jobs, `updated_at` == `created_at` hours later — and such a run is neither cancellable (409 "has
  # not been queued yet") nor rerunnable. Measured 2026-08-26 on the 0.33.0 cut, where the same stall
  # orphaned this repo's TAG-triggered `release.yml` run and forced deleting and re-pushing a tag a
  # live Release pointed at (see release.yml). This file had the identical exposure with no dispatch
  # trigger to fall back on. The `test`/`release-build`/`linux` jobs below already gate on
  # `github.event_name != 'schedule'`, so a dispatch runs them like an ordinary push; the linux job's
  # disclosure-recall step already special-cased `== 'workflow_dispatch'` — that branch was dead code
  # until this trigger existed to reach it.
  workflow_dispatch:

# The spec commit the push/PR gates run against. Bump deliberately when adopting a floor rise; the
# weekly spec-head job is the early-warning that HEAD has moved past this pin.
#
# A STALE PIN IS NOT A CONSERVATIVE DEFAULT — IT IS A GREEN CHECK OVER THE WRONG CONTRACT. This sat at
# `eccfac71` for the whole ⟨0.32⟩ rung: 797 commits behind spec HEAD and older than every commit that
# wrote the rung's fixtures, so every push went green while the oracle asked the ⟨0.29⟩-era questions.
# The weekly spec-head lane is the early warning ONLY if someone reads it; the pin is what the gate
# actually enforces, so it moves WITH the floor and in the same commit as the engine's rung work.
# Bumped to `3c643e5` (2026-08-24) — the ⟨0.32⟩ carve-out commit, which is the contract this engine now
# implements. Keep this and release.yml's literal in step.
env:
  CANDOR_SPEC_PIN: 3c643e54c22b5f4352ea944800b55fba72dc211b

jobs:
  # SOUNDNESS R339 — A SAFETY ASSERTION MUST ARRIVE WITH A TEST.
  #
  # Measured 2026-09-01 across the whole family in one round: four engines shipped ⟨0.35⟩ fixes, every
  # one carried a comment asserting a property, and every one of those claims turned out to be wrong —
  # one of them a cardinal sin introduced by the fix itself. Nobody verifies the sentence that makes
  # their own diff correct, which is why this is a gate and not a habit.
  #
  # (The wording above deliberately PARAPHRASES those claims rather than quoting them. This gate greps
  # ADDED LINES for assertion language, so a comment that QUOTES a false assertion as a cautionary
  # example trips it — measured: the first cut of this block cited one verbatim and failed its own gate
  # in all four engines. Describe the claim, do not reproduce it.)
  #
  # It does NOT judge whether an assertion is true — no grep can. It asks the cheaper question that would
  # have caught the real cases: you asserted safety, did you change a test in the same range?
  #
  # TRIAGED BEFORE BEING TURNED ON (2026-09-13, 120 commits across the four engines). 13 failed: 4 were
  # docs-only ranges, which the tool now SELF-SKIPS (exit 3 — visibly unjudged, never a pass), and 9
  # touched source and were the tool working. Four of those nine are the masking-guard commits R379,
  # R383 and R386, whose comments carried "under-catching is a missed mask, never a broken gate" — the
  # sentence SOUNDNESS R399 later proved false. This gate flagged them as they landed.
  #
  # Green on arrival: all four engines pass at HEAD, so this lands on no backlog.
  assert-audit:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the audit reads a RANGE, and the default shallow clone has no parent to diff.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Safety assertions must arrive with a test
        run: |
          set -u
          # The clone lives INSIDE this block on purpose. `bin/gates.sh` extracts every `run:` step so
          # `gate-run.sh` can replay a repo's CI locally, and a single-line `run:` is executed verbatim —
          # so a standalone clone step would put a NETWORK FETCH in every local gate run. Kept here, the
          # whole block carries GitHub expressions, is skipped locally as a block line, and still runs
          # in full in CI.
          #
          # AND DO NOT WRITE AN EMPTY EXPRESSION IN A COMMENT HERE. GitHub interpolates expressions
          # BEFORE the shell ever sees this file, so the empty one this line used to contain — written
          # to NAME the mechanism — was parsed as an expression, failed, and made the whole workflow
          # invalid: no jobs ran and all four engines reported the failure against the file PATH rather
          # than the workflow name. A comment about a mechanism triggered the mechanism.
          #
          # /tmp rather than a checkout under the workspace: a checkout inside this tree would dirty it,
          # and several gates in this family refuse a dirty tree. Same shape candor-ts already uses to
          # reach candor-spec.
          git clone --depth 1 https://github.com/tombaldwin/candor /tmp/candor-tools
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            case "$before" in
              ""|0000000000000000000000000000000000000000) range="HEAD~1..HEAD" ;;
              *) range="$before..HEAD" ;;
            esac
          fi
          echo "range: $range"
          # `set +e` DELIBERATELY. GitHub runs `run:` under `bash -e`, so without this the script aborts
          # on ANY non-zero before `rc` is ever read — including exit 3, the family's SELF-SKIP, which
          # would turn every docs-only commit into a CI failure. That is the imprecision this gate was
          # triaged to remove, reintroduced by the harness instead of the tool.
          set +e
          bash /tmp/candor-tools/bin/assert-audit.sh "$PWD" "$range"
          rc=$?
          set -e
          # An `if`, not `[ "$rc" = 3 ] && exit 0`: under `-e` that one-liner evaluates to FALSE whenever
          # rc is not 3, and a compound statement returning 1 fails the step — so the success path would
          # have failed too.
          if [ "$rc" = 3 ]; then
            echo "assert-audit self-skipped (docs-only range) — not a pass, and not a failure."
            exit 0
          fi
          exit "$rc"

  test:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    # A healthy run is ~3 min (SwiftSyntax ships prebuilt binaries); anything past 20 is a hung runner
    # — kill it rather than burn 6h of 10x-billed macOS minutes (observed live, twice, 2026-07-02).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: swift build
      - name: Unit tests (CandorCore — the extracted pure classifier + type helpers)
        # `script` gives swift test a TTY → line-buffered output → a hang shows the LAST test started
        # in the live log (block-buffered output vanishes on cancel — learned the hard way, 2026-07-02).
        run: script -q /dev/null swift test
      - name: Smoke (oracle needs the spec as a sibling — PINNED; spec-head tracks HEAD weekly)
        run: |
          git clone https://github.com/tombaldwin/candor-spec ../candor-spec
          git -C ../candor-spec checkout --quiet "$CANDOR_SPEC_PIN"
          bash smoke.sh
      - name: Soundness fuzzer (§7.13)
        run: python3 fuzz.py
      - name: Fabrication probe (the never-fabricate / never-lose-control guard)
        run: python3 fabrication_probe.py
      # The non-syscall half of the dynamic oracle (Ipc/Log/Rand/Env/Clock — strace can't distinguish these,
      # so the ground truth is documented API semantics). Needs no strace, so it runs on macOS here and
      # complements the Linux strace oracle (Fs/Net/Exec) — together they cover the full effect vocabulary.
      - name: Recall oracle (non-syscall effects — known-semantics)
        run: bash soundness/realworld/recall/recall.sh
      - name: Self-gate (§7.12 — the engine holds its own boundary)
        # The analyzer reads source + writes reports (Fs/Env). It must reach the network / a database NOWHERE,
        # and spawn a subprocess ONLY in main.swift (the `--workspace` chain spawns candor-swift itself on each
        # workspace dep and reads the report back through a Pipe → Exec + Ipc; Xcode-scope resolution shells out
        # via /usr/bin/env). A prefix deny can't carve out one file, so the two halves are proved separately —
        # the whole engine under .candor/policy, plus an assertion that the Exec/Ipc units are EXACTLY the four
        # declared ones. This step used to make the strict policy pass by copying Sources and DELETING
        # main.swift, which left 2158 lines where a new subprocess was caught by nothing. See ci/self-gate.sh.
        run: bash ci/self-gate.sh

  # THE RELEASE-CONFIGURATION BUILD, ON `main`, NOT ON A TAG. Every `swift build` in this file is a DEBUG
  # build. Until 2026-08-25 nothing in this repo compiled `-c release` until `release.yml` did, on a pushed
  # `v*` tag — so `candor-swift-macos-arm64`, the artifact a user downloads and the only install route that
  # does not need a Swift toolchain, was compiled for the FIRST TIME after the tag existed and the release
  # had been cut. `-c release` is a genuinely different compile: whole-module optimisation, a different set
  # of warnings, its own link step. A gate positioned after the irreversible step grades the release; it
  # does not guard it — the same lesson, the same week, as candor-java's native parity gate catching an
  # empty scan only once v0.32.0 was public.
  #
  # `release.yml` still does this, and must: it compares the binary against the TAG, which does not exist
  # yet here. What changes is that a release build which cannot COMPILE, or a binary that misreports
  # itself, is now discovered on the push that caused it rather than on the cut.
  #
  # ITS OWN JOB, not a step in `test`. `test`'s 20-minute budget is a HANG DETECTOR calibrated against a
  # ~3-minute healthy run (see its comment); hanging a whole second compile off it would make that budget
  # meaningless and a genuine hang indistinguishable from a slow optimiser. A separate job also runs in
  # parallel, so it adds no wall clock to CI, and macos-15 runners are free on a public repo.
  release-build:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Release build + the binary names the declared engineVersion
        run: |
          set -euo pipefail
          swift build -c release
          BIN=.build/release/candor-swift
          test -x "$BIN" || { echo "::error::no release binary at $BIN"; exit 1; }
          # release.yml asserts the binary's --version names the TAG. There is no tag here, so assert it
          # against what the tag is itself checked against — main.swift's engineVersion constant. Same
          # assertion on the same artifact, one step earlier, needing no release to exist.
          DECL="$(sed -n 's/^let engineVersion = "candor-swift-\(.*\)"$/\1/p' Sources/candor-swift/main.swift)"
          # AND IT MUST NOT BE EMPTY. `case "$got" in *""*)` matches EVERYTHING — a rename or a reformat of
          # that line would leave DECL empty and this gate would then pass on any binary whatsoever. That
          # is the vacuous-gate shape candor-java's parity check grew its own non-vacuousness control for:
          # a comparison whose reference value went missing does not fail, it stops asking anything.
          [ -n "$DECL" ] || { echo "::error::could not read engineVersion from Sources/candor-swift/main.swift — this gate would be vacuous"; grep -n 'let engineVersion' Sources/candor-swift/main.swift; exit 1; }
          got="$("$BIN" --version | head -1)"
          case "$got" in
            *"$DECL"*) echo "release binary reports '$got', which names the declared engineVersion $DECL";;
            *) echo "::error::release binary reports '$got', which does not name the declared engineVersion $DECL"; exit 1;;
          esac
      # Keep it. A `main` build whose binary a later tag merely re-cuts is worth having downloadable,
      # and it makes the artifact this job proved something you can actually go and look at.
      - name: Upload the release binary
        uses: actions/upload-artifact@v4
        with:
          name: candor-swift-macos-arm64
          path: .build/release/candor-swift

  # Linux is in scope (Glibc/Musl sit in PLATFORM_MODULES) and swift-corelibs-foundation DIVERGES from
  # Darwin Foundation — the URL.deletingLastPathComponent root-behaviour class (38fbc71) would have been
  # caught here, not on a hung macOS runner.
  linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container: swift:6.1
    # SwiftSyntax has NO prebuilt binaries for Linux — it compiles from source, so this job is the slow
    # lane (~20-30 min). Budget accordingly; the concurrency group still cancels superseded runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Harness deps (the swift image is minimal — smoke/fuzz/probe need python3, the TTY wrapper `script` is util-linux, the dynamic oracle needs strace)
        timeout-minutes: 5  # a network install; a hung mirror must not spend the job's budget
        run: apt-get update -qq && apt-get install -y -qq python3 util-linux strace >/dev/null
      - name: Build
        run: swift build
      - name: Unit tests
        # Same TTY treatment as macOS, in util-linux spelling: `script -qec "<cmd>" /dev/null`
        # (-e propagates the child's exit code; the BSD `script -q /dev/null cmd` form doesn't parse here).
        #
        # BOUNDED at 15m, well under the job's 45m. Added 2026-08-02, after `Process.waitUntilExit()` was
        # found to block FOREVER on swift-corelibs-foundation once the child has already exited — a defect
        # that had been invisible because the harness could not locate the test binary on Linux, so every
        # process suite skipped. Now that those rows actually RUN, a regression of that shape hangs. Without
        # a bound it would consume the whole 45-minute budget and surface as an opaque job cancellation;
        # with one it fails as a NAMED step, fast, with the last `Test Case ... started` line still on
        # screen naming the row that hung. The suite takes ~20s on macOS, so 15m is not a tight fit — it is
        # a hang detector, not a performance budget.
        #
        # Linux only, deliberately: the hang is in swift-corelibs-foundation. macOS uses the real Foundation
        # and `timeout` is not in its base image anyway (it is `gtimeout`, from coreutils).
        run: |
          timeout --signal=TERM --kill-after=30s 15m script -qec "swift test" /dev/null
          rc=$?
          if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
            echo "::error title=swift test HUNG::Exceeded 15m. This is a HANG, not a slow suite — the suite runs in ~20s. The last 'Test Case ... started' line above names the row. Prime suspect: a blocking primitive that never returns on swift-corelibs-foundation (see the terminationHandler+semaphore pattern in ProcessHarness and main.swift's --workspace spawner)."
          fi
          exit $rc
      - name: Smoke (pinned spec)
        run: |
          git clone https://github.com/tombaldwin/candor-spec ../candor-spec
          git -C ../candor-spec checkout --quiet "$CANDOR_SPEC_PIN"
          bash smoke.sh
      - name: Soundness fuzzer (§7.13)
        run: python3 fuzz.py
      - name: Fabrication probe
        run: python3 fabrication_probe.py
      # The mechanism-INDEPENDENT soundness tier (static → conformance → THIS): each driver exercises a real
      # effect under strace; a silent-pure that demonstrably RAN is the cardinal sin. Linux-only (strace);
      # rebuilds candor-swift once (already built above, cached). Closes the RQ3 gap — swift was the only
      # engine without a runtime honesty oracle (rust has strace, java a bytecode agent, ts verify-core).
      - name: Dynamic honesty oracle (runtime syscall ground truth — Fs/Net/Exec)
        run: bash soundness/realworld/run.sh
      # Also run the non-syscall recall here: swift-corelibs-foundation DIVERGES from Darwin Foundation, so
      # verify the Ipc/Log/Rand/Env/Clock classifications hold on Linux too.
      - name: Recall oracle (non-syscall effects — known-semantics)
        run: bash soundness/realworld/recall/recall.sh
      # Is the oracle above able to FAIL? A green run of it means "no silent under-report was found", which
      # is only evidence about candor if a violation COULD have been reported — a marker that stops firing or
      # a verdict loosened in a refactor would give a permanent green indistinguishable from soundness. This
      # seeds the defect the oracle exists to catch and requires it to turn red. Three passes of the oracle,
      # so it is gated to the schedule + manual runs rather than every PR.
      - name: Disclosure-recall calibration (seed a false all-clear; the oracle must catch it)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash soundness/realworld/recall/disclosure_recall.sh

  # Weekly early-warning lane: run the smoke oracle against candor-spec HEAD, so a floor rise (a new
  # conformance case, a tightened expectation) surfaces as a scheduled red — without redding PRs, which
  # stay pinned to CANDOR_SPEC_PIN. When this goes red: adapt, then bump the pin.
  spec-head:
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: swift build
      - name: Smoke against spec HEAD
        run: |
          git clone --depth 1 https://github.com/tombaldwin/candor-spec ../candor-spec
          bash smoke.sh
